version: '3.8'

services:
  # Banco de Dados Relacional - SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: microshop-sqlserver
    user: root 
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Pass@word123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    networks:
      - microshop-network

  # Mensageria - RabbitMQ (com Dashboard Web)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: microshop-rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"   # Porta AMQP para comunicação entre microsserviços
      - "15672:15672" # Porta HTTP para a interface gráfica Web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microshop-network

# Redes e Volumes
networks:
  microshop-network:
    driver: bridge

volumes:
  sqlserver_data:
  rabbitmq_data: